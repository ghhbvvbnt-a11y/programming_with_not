/* ---------------- AI ---------------- */
const SYS='You are "NP AI", an expert programming mentor inside the "Not Programming" learning platform (students are Egyptian secondary-school pupils and self-learners). Teach step by step, give correct modern code in fenced code blocks with the language name, explain briefly why it works, point out bugs precisely, and suggest a small practice exercise when useful. Prefer clear simple explanations over long lectures. Always answer in the language the student writes in (Arabic - Egyptian dialect is fine, English or French). If asked something unrelated to programming, computing or studying, politely steer back. Never claim to have run code you have not run.';
function md(s){const bl=[];s=esc(s).replace(/```\w*\n?([\s\S]*?)```/g,(_,c)=>{bl.push(c);return '\u0000'+(bl.length-1)+'\u0000'});s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre dir="ltr"><code>${bl[i]}</code></pre>`)}
let aiu={};
function aiN(){const d=new Date().toDateString(),u=aiu[me.email]||(aiu[me.email]={d,n:0});if(u.d!==d){u.d=d;u.n=0}return u}

 <div class="chat big">${aih.map(m=>`<div class="bub ${m.r==='user'?'me':''}"><small>${m.r==='user'?t('you'):'NP AI'}</small>${md(m.c)}</div>`).join('')}${busy?`<div class="bub"><small>NP AI</small>${t('aiThink')}</div>`:''}</div>
 <div class="rowin"><textarea id="aiq" rows="2" placeholder="${t('aiP')}"></textarea><button class="b" style="width:auto" onclick="sendAI()">${I('send',16)}</button></div>`}

 aih.push({r:'user',c:x});busy=true;render();
 try{const r=await fetch(db.ai||'https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:SYS,messages:aih.filter(m=>!m.e).slice(-12).map(m=>({role:m.r,content:m.c}))})});
  const d=await r.json(),tx=(d.content||[]).map(y=>y.text||'').join('');if(!tx)throw 0;aih.push({r:'assistant',c:tx});u.n++}

function dStu(){return db.users.map(u=>{const exCount=db.examResults.filter(r=>r.email===u.email).length;
 if(!grantSel[u.id]||!db.courses.find(c=>c.id===grantSel[u.id]))grantSel[u.id]=(db.courses[0]&&db.courses[0].id)||'';
 return `<div class="bx"><div style="display:flex;gap:12px;align-items:center"><div class="av2">${av(u,26)}</div><div><b>${esc(u.name)}</b><div style="color:var(--mut);font-size:13px">${t('g'+u.g)} · ${esc(u.age||'')} · ${esc(u.email)}</div><div style="font-size:13px">${t('sp')}: ${esc(u.phone||'')} | ${t('pp')}: ${esc(u.parent||'')}</div><div style="font-size:12px;color:var(--mut)">${t('lastActive')}: ${u.lastActive?fd(u.lastActive):'-'} · ${t('examsTaken')}: ${exCount}</div></div></div>
 <div style="display:flex;gap:8px;margin-top:8px"><select id="gs_${u.id}" style="margin:0;flex:1" onchange="grantSel['${u.id}']=this.value">${db.courses.map(c=>`<option value="${c.id}" ${grantSel[u.id]===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select><button class="c" onclick="grant('${u.id}')">${t('grant')}</button>${exCount?`<button class="c" onclick="dt='gr';grFilterEmail='${u.email}';render()">${t('viewGrades')}</button>`:''}</div></div>`}).join('')||`<p>${t('none')}</p>`}
async function grant(uid){const u=db.users.find(x=>x.id===uid),cid=grantSel[uid],c=cid&&db.courses.find(x=>x.id===cid);if(!u||!c)return;
 try{await fs.collection('payments').add({uid:u.id,email:u.email,name:u.name,phone:u.phone||'',cid:c.id,title:c.title,amount:c.price,m:'manual',ts:Date.now(),s:'a'})}catch(e){alert(t('connErr'))}}
function dGr(){const list=grFilterEmail?db.examResults.filter(r=>r.email===grFilterEmail):db.examResults;
 const header=grFilterEmail?`<div class="rw"><b>${esc(grFilterEmail)}</b><button class="c" onclick="grFilterEmail='';render()">${t('allStudents')}</button></div>`:'';
 return header+(list.map(r=>`<div class="bx"><div class="rw"><span><b>${esc(r.name)}</b> — ${esc(r.courseTitle)} / ${esc(r.examTitle)}</span><span class="pr">${r.score}/${r.max}</span></div><small style="color:var(--mut)">${fd(r.ts)}</small>
 <button class="c" onclick="toggleGrade('${r.id}')">${t('details')}</button>
 ${expandedGrade===r.id?`<div style="margin-top:8px">${r.answers.map((a,i)=>`<div class="rw"><span>${i+1}. ${esc(a.q)}</span><span class="${a.ok?'ok':'no'}">${esc(a.chosen)}${a.ok?'':' → '+esc(a.correctText)}</span></div>`).join('')}</div>`:''}</div>`).join('')||`<p>${t('none')}</p>`)}
function toggleGrade(id){expandedGrade=expandedGrade===id?null:id;render()}
function dMsg(){return thr().map((a,i)=>`<div class="bx"><b>${esc(a[0].name)}</b> <small style="color:var(--mut)">${used(a[0].email)}/3</small><div class="chat sm">${a.map(m=>`<div class="bub ${m.from==='t'?'me':''}"><small>${m.from==='t'?t('teacher'):esc(m.name)} · ${fd(m.ts)}</small>${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}</div><div class="rowin"><textarea id="rp${i}" rows="2" placeholder="${t('msgP')}"></textarea><button class="b" style="width:auto" onclick="reply(${i})">${I('send',16)}</button></div></div>`).join('')||`<p>${t('none')}</p>`}
async function reply(i){const a=thr()[i],x=cl($('#rp'+i).value);if(!x)return;try{await fs.collection('messages').add({uid:a[0].uid||'',email:a[0].email,name:a[0].name,from:'t',text:x,ts:Date.now()})}catch(e){alert(t('connErr'))}}
function dSet(){return `<div class="bx"><h4>${t('profile')}</h4><div style="display:flex;align-items:center;gap:14px;margin-bottom:10px"><div class="av2">${av(me,40)}</div><label class="c" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center">${I('camera',15)} ${t('photo')}<input type="file" accept="image/*" hidden onchange="setTeacherPhoto(this)"></label></div><input id="tn" value="${esc(db.teacherName)}" placeholder="${t('name')}"><textarea id="tbio" rows="2" placeholder="${t('hp')}">${esc(db.teacherBio||'')}</textarea><button class="b" onclick="saveTeacherProfile()">${t('save')}</button></div>
 <div class="bx"><h4>${t('wal')}</h4><small>${t('wn')}</small><input id="w" dir="ltr" value="${esc(db.wallet)}"><small>${t('in')}</small><input id="i" dir="ltr" value="${esc(db.insta)}"><small>${t('aiUrl')}</small><input id="ai" dir="ltr" placeholder="https://your-worker.workers.dev" value="${esc(db.ai||'')}"><button class="b" onclick="saveSettings(this)">${t('save')}</button></div>`}
async function setTeacherPhoto(inp){const f=inp.files[0];if(!f)return;try{const url=await uploadImage(f,`teacher/photo_${Date.now()}.jpg`,300);await fs.collection('teacherProfile').doc('main').set({photo:url},{merge:true})}catch(e){alert(t('connErr'))}}
async function saveTeacherProfile(){try{await fs.collection('teacherProfile').doc('main').set({name:cl($('#tn').value),bio:cl($('#tbio').value)},{merge:true})}catch(e){alert(t('connErr'))}}
async function saveSettings(btn){try{await fs.collection('settings').doc('main').set({wallet:cl($('#w').value),insta:cl($('#i').value),ai:cl($('#ai').value)},{merge:true});if(btn)btn.textContent='OK'}catch(e){alert(t('connErr'))}}

function drawPay(){$('#md').innerHTML=`<h3 style="margin-top:0">${t('pay')}: ${esc(pz.title)}</h3><div class="pr">${pz.price} ${t('egp')}</div>
 <div class="pm">${['vc','ip'].map(m=>`<button class="${pmth===m?'on':''}" onclick="pmth='${m}';drawPay()">${t(m)}</button>`).join('')}</div><small>${t('send')}</small><div class="nm">${esc(pmth==='vc'?db.wallet:db.insta)}</div>
 <small>${t('proof')}</small><input type="file" id="pf" accept="image/*"><button class="b" onclick="sendPay()">${t('conf')}</button><button class="b s" onclick="closeM()">${t('cancel')}</button>`}

 try{const url=await uploadImage(f,`payments/${me.uid}_${Date.now()}.jpg`,900);await fs.collection('payments').add({uid:me.uid,email:me.email,name:me.name,phone:me.phone||'',cid:pz.id,title:pz.title,amount:pz.price,m:pmth,img:url,ts:Date.now(),s:'p'});closeM();alert(t('sent'))}catch(e){alert(t('connErr'))}}

 try{navigator.clipboard.writeText(x).then(d,fb)}catch(e){fb()}}
